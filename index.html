<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Manga Streamer</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #161616;
    --surface-2: #1f1f1f;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --text-dim: #888;
    --accent: #ff4d4d;
    --accent-soft: rgba(255, 77, 77, 0.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                 "Yu Gothic Medium", "Meiryo", sans-serif;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input { font: inherit; }
  .hidden { display: none !important; }

  /* ---------- Sign-in screen ---------- */
  #signin-screen {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
    text-align: center;
  }
  #signin-screen h1 {
    margin: 0 0 8px; font-size: 32px; letter-spacing: 0.04em;
    font-weight: 700;
  }
  #signin-screen h1 .accent { color: var(--accent); }
  #signin-screen p.tagline {
    margin: 0 0 32px; color: var(--text-dim); font-size: 14px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; max-width: 480px; width: 100%;
    text-align: left;
  }
  .card label {
    display: block; font-size: 12px; color: var(--text-dim);
    margin-bottom: 6px; letter-spacing: 0.05em; text-transform: uppercase;
  }
  .card input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); font-size: 14px; font-family: ui-monospace, monospace;
  }
  .card input:focus { outline: none; border-color: var(--accent); }
  .btn-primary {
    width: 100%; padding: 12px 16px; margin-top: 16px;
    background: var(--accent); color: #fff; border: none;
    border-radius: 8px; font-size: 15px; font-weight: 600;
    transition: filter 0.15s;
  }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .help {
    margin-top: 16px; padding: 12px; background: var(--surface-2);
    border-radius: 8px; font-size: 12px; color: var(--text-dim);
    line-height: 1.6;
  }
  .help code {
    color: var(--text); background: var(--bg); padding: 1px 4px;
    border-radius: 3px; font-size: 11px;
  }

  /* ---------- Browser screen ---------- */
  #browser-screen {
    display: flex; flex-direction: column; height: 100vh;
  }
  .topbar {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 12px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  .topbar-content {
    flex: 1; min-width: 0;
    display: flex; align-items: center;
  }
  .topbar .breadcrumb {
    flex: 1; font-size: 14px; color: var(--text-dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    direction: rtl; text-align: left;
    padding: 0 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .topbar .breadcrumb .path { color: var(--text); }
  .topbar .search-box {
    flex: 1; display: flex; align-items: center; gap: 6px;
    background: var(--surface-2); border-radius: 8px;
    padding: 0 10px; height: 36px;
  }
  .topbar .search-box input {
    flex: 1; border: none; background: transparent;
    color: var(--text); font-size: 14px; outline: none;
    min-width: 0;
  }
  .topbar .search-box .search-clear {
    background: transparent; border: none; color: var(--text-dim);
    padding: 2px 4px; line-height: 1; font-size: 16px;
  }
  .icon-btn {
    background: transparent; border: none; color: var(--text);
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn.active { background: var(--accent-soft); color: var(--accent); }
  .icon-btn svg { width: 20px; height: 20px; }

  /* Sync indicator */
  .sync-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
    opacity: 0; transition: opacity 0.2s;
  }
  .sync-dot.active { opacity: 1; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  #file-list {
    flex: 1; overflow-y: auto; padding: 8px 0;
  }
  .file-row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background 0.1s;
  }
  .file-row:hover { background: var(--surface); }
  .file-row .icon {
    width: 36px; height: 36px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
  }
  .file-row.folder .icon { background: rgba(255, 200, 100, 0.15); }
  .file-row.folder.shared .icon { background: rgba(120, 180, 255, 0.18); }
  .file-row.zip .icon { background: var(--accent-soft); }
  .file-row .icon svg { width: 22px; height: 22px; }
  .file-row.folder .icon svg { color: #ffc864; }
  .file-row.folder.shared .icon svg { color: #78b4ff; }
  .file-row.zip .icon svg { color: var(--accent); }

  /* Larger thumbnail rows for ZIP files: ~120px tall cover image on the left,
     metadata on the right. Folders keep the compact small-icon layout. */
  .file-row.zip {
    align-items: stretch;
    padding: 10px 16px;
    gap: 14px;
  }
  .file-row.zip .thumb {
    flex-shrink: 0;
    width: 90px;
    height: 130px;
    background: var(--surface-2);
    border-radius: 6px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .file-row.zip .thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .file-row.zip .thumb .thumb-fallback {
    color: var(--accent); opacity: 0.4;
  }
  .file-row.zip .thumb .thumb-fallback svg { width: 32px; height: 32px; }
  .file-row.zip .meta {
    display: flex; flex-direction: column; justify-content: center;
  }
